<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Estampas japonesas</title>
  <style>
    :root {
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 220px;
      max-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background: #d2c8af;
      border: 0;
      border-radius: 18px;
      box-shadow: none;
    }
    .art, .wash, .art img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .art { margin: 0; }
    .wash {
      object-fit: cover;
      filter: blur(22px) brightness(.72);
      transform: scale(1.08);
      transition: opacity .5s ease;
    }
    .art img.main {
      z-index: 1;
      object-fit: cover;
      object-position: center top;
      transition: opacity .45s ease;
    }
    @media (max-width: 560px) {
      body { padding: 4px; }
      .frame { min-height: 190px; border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="frame" role="region" aria-label="Galería de estampas japonesas">
    <figure class="art">
      <img class="wash" id="wash" alt="" aria-hidden="true">
      <img class="main" id="artwork" alt="Estampa japonesa">
    </figure>
  </main>

        "the-new-york-public-library-XjSCuYYOhzI-unsplash.jpg",
        "the-walters-art-museum-Fi9Gs9Hy6qg-unsplash.jpg",
        "the-walters-art-museum-TOzWQvcw0_U-unsplash.jpg",
      ];
      const artwork = document.getElementById("artwork");
      const wash = document.getElementById("wash");
      const slideInterval = 33000;
      const storageKey = "yakob-japanese-art-index";
      function readSavedIndex() {
        try {
          const saved = Number.parseInt(localStorage.getItem(storageKey), 10);
          return Number.isInteger(saved) && saved >= 0 ? saved % files.length : 0;
        } catch (_) {
          return 0;
        }
      }
      let index = readSavedIndex();
      const source = file => `assets/japan/${encodeURIComponent(file)}`;

      function show(nextIndex) {
        index = (nextIndex + files.length) % files.length;
        try { localStorage.setItem(storageKey, String(index)); } catch (_) {}
        const path = source(files[index]);
        artwork.style.opacity = "0";
        wash.style.opacity = "0";
        const preload = new Image();
        preload.onload = () => {
          artwork.src = path;
          wash.src = path;
          artwork.style.opacity = "1";
          wash.style.opacity = "1";
        };
        preload.onerror = () => {
          artwork.style.opacity = "1";
          wash.style.opacity = "1";
        };
        preload.src = path;
      }

      show(index);
      window.setInterval(() => show(index + 1), slideInterval);
    })();
  </script>
</body>
</html>
