<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Estampas japonesas</title>
  <style>
    :root {
      color-scheme: light;
      --progress: rgba(255, 255, 255, .9);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --progress: rgba(28, 28, 30, .9);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 220px;
      max-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background: #d2c8af;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 18px;
      box-shadow:
        0 0 34px 4px rgba(210, 176, 120, .28),
        0 18px 48px rgba(0, 0, 0, .28),
        inset 0 1px rgba(255, 255, 255, .34);
    }
    .art, .wash, .art img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .art { margin: 0; }
    .wash {
      object-fit: cover;
      filter: blur(22px) brightness(.72);
      transform: scale(1.08);
      transition: opacity .5s ease;
    }
    .art img.main {
      z-index: 1;
      object-fit: cover;
      object-position: center top;
      transition: opacity .45s ease;
    }
    .shade {
      position: absolute;
      z-index: 2;
      inset: 35% 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px;
      color: white;
      background: linear-gradient(transparent, rgba(0, 0, 0, .58));
      pointer-events: none;
    }
    .caption { display: grid; gap: 6px; text-shadow: 0 1px 8px rgba(0, 0, 0, .4); }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
    .caption strong { font-size: clamp(16px, 2vw, 22px); font-weight: 550; letter-spacing: -.02em; }
    .counter { align-self: flex-end; font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .08em; opacity: .9; white-space: nowrap; }
    .progress { position: absolute; z-index: 4; right: 0; bottom: 0; left: 0; height: 3px; background: rgba(255,255,255,.24); }
    .progress span { display: block; height: 100%; width: 0; background: var(--progress); }
    @media (max-width: 560px) {
      body { padding: 4px; }
      .frame { min-height: 190px; border-radius: 14px; }
      .shade { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="frame" role="region" aria-label="Galería de estampas japonesas">
    <figure class="art">
      <img class="wash" id="wash" alt="" aria-hidden="true">
      <img class="main" id="artwork" alt="Estampa japonesa">
      <figcaption class="shade">
        <span class="caption">
          <span class="eyebrow">Colección japonesa</span>
          <strong>Estampas japonesas</strong>
        </span>
        <span class="counter" id="counter" aria-live="polite">01 / 25</span>
      </figcaption>
    </figure>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
  </main>
  <script>
    (() => {
      const files = [
        "1.jpg",
        "art-institute-of-chicago--06Of684aas-unsplash.jpg",
        "art-institute-of-chicago-2iQMbDFiGhc-unsplash.jpg",
        "art-institute-of-chicago-2JfVRs6BkNo-unsplash.jpg",
        "art-institute-of-chicago-3vRZNa8EjF0-unsplash.jpg",
        "art-institute-of-chicago-adHj6_pakQs-unsplash.jpg",
        "art-institute-of-chicago-FbsgprE_YRI-unsplash.jpg",
        "art-institute-of-chicago-gGM8Tfa4E2M-unsplash.jpg",
        "art-institute-of-chicago-mli2UBmERXo-unsplash.jpg",
        "art-institute-of-chicago-oOfKmaGYFRM-unsplash.jpg",
        "art-institute-of-chicago-P4G54L_HhZI-unsplash.jpg",
        "art-institute-of-chicago-VBIBfUiKwlA-unsplash.jpg",
        "art-institute-of-chicago-YRBfKS79Wgk-unsplash.jpg",
        "birmingham-museums-trust-bs0rerP5S84-unsplash.jpg",
        "birmingham-museums-trust-DOyLqkSBunI-unsplash.jpg",
        "the-cleveland-museum-of-art-1c21Tk73SN0-unsplash.jpg",
        "the-cleveland-museum-of-art-FzKgiEibnEo-unsplash.jpg",
        "the-cleveland-museum-of-art-HSaug6LVZWE-unsplash.jpg",
        "the-cleveland-museum-of-art-Ir7apM_ZDrA-unsplash.jpg",
        "the-cleveland-museum-of-art-QpxGWEvCtYE-unsplash.jpg",
        "the-cleveland-museum-of-art-U9QJy0F_3MU-unsplash.jpg",
        "the-cleveland-museum-of-art-zCuiDBrKIVo-unsplash.jpg",
        "the-cleveland-museum-of-art-Zn0ej6CFbOw-unsplash.jpg",
        "the-new-york-public-library-XDLJIT94Eg8-unsplash.jpg",
        "the-walters-art-museum-K0LM79r2uGs-unsplash.jpg"
      ];
      const artwork = document.getElementById("artwork");
      const wash = document.getElementById("wash");
      const counter = document.getElementById("counter");
      const progress = document.getElementById("progress");
      const slideInterval = 213000;
      let index = 0;
      const source = file => `assets/japan/${encodeURIComponent(file)}`;

      function show(nextIndex) {
        index = (nextIndex + files.length) % files.length;
        const path = source(files[index]);
        artwork.style.opacity = "0";
        wash.style.opacity = "0";
        const preload = new Image();
        preload.onload = () => {
          artwork.src = path;
          wash.src = path;
          artwork.style.opacity = "1";
          wash.style.opacity = "1";
        };
        preload.onerror = () => {
          artwork.style.opacity = "1";
          wash.style.opacity = "1";
        };
        preload.src = path;
        counter.textContent = `${String(index + 1).padStart(2, "0")} / ${String(files.length).padStart(2, "0")}`;
        progress.style.transition = "none";
        progress.style.width = "0";
        requestAnimationFrame(() => {
          progress.style.transition = `width ${slideInterval}ms linear`;
          progress.style.width = "100%";
        });
      }

      show(0);
      window.setInterval(() => show(index + 1), slideInterval);
    })();
  </script>
</body>
</html>
