<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Estampas japonesas</title>
  <style>
    :root {
      color-scheme: light;
      --progress: rgba(255, 255, 255, .9);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --progress: rgba(28, 28, 30, .9);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 220px;
      max-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background: #d2c8af;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 18px;
      box-shadow: none;
    }
    .art, .wash, .art img { position: absolute; inset: 0; width: 100%; height: 100%; }
    .art { margin: 0; }
    .wash {
      object-fit: cover;
      filter: blur(22px) brightness(.72);
      transform: scale(1.08);
      transition: opacity .5s ease;
    }
    .art img.main {
      z-index: 1;
      object-fit: cover;
      object-position: center top;
      transition: opacity .45s ease;
    }
    .progress { position: absolute; z-index: 4; right: 0; bottom: 0; left: 0; height: 3px; background: rgba(255,255,255,.24); }
    .progress span { display: block; height: 100%; width: 0; background: var(--progress); }
    @media (max-width: 560px) {
      body { padding: 4px; }
      .frame { min-height: 190px; border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="frame" role="region" aria-label="Galería de estampas japonesas">
    <figure class="art">
      <img class="wash" id="wash" alt="" aria-hidden="true">
      <img class="main" id="artwork" alt="Estampa japonesa">
    </figure>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
  </main>
  <script>
    (() => {
      const files = [
        "1.jpg",
        "art-institute-of-chicago--06Of684aas-unsplash.jpg",
        "art-institute-of-chicago-2iQMbDFiGhc-unsplash.jpg",
        "art-institute-of-chicago-2JfVRs6BkNo-unsplash.jpg",
        "art-institute-of-chicago-3vRZNa8EjF0-unsplash.jpg",
        "art-institute-of-chicago-adHj6_pakQs-unsplash.jpg",
        "art-institute-of-chicago-FbsgprE_YRI-unsplash.jpg",
        "art-institute-of-chicago-gGM8Tfa4E2M-unsplash.jpg",
        "art-institute-of-chicago-mli2UBmERXo-unsplash.jpg",
        "art-institute-of-chicago-oOfKmaGYFRM-unsplash.jpg",
        "art-institute-of-chicago-P4G54L_HhZI-unsplash.jpg",
        "art-institute-of-chicago-VBIBfUiKwlA-unsplash.jpg",
        "art-institute-of-chicago-YRBfKS79Wgk-unsplash.jpg",
        "birmingham-museums-trust-bs0rerP5S84-unsplash.jpg",
        "birmingham-museums-trust-DOyLqkSBunI-unsplash.jpg",
        "the-cleveland-museum-of-art-1c21Tk73SN0-unsplash.jpg",
        "the-cleveland-museum-of-art-FzKgiEibnEo-unsplash.jpg",
        "the-cleveland-museum-of-art-HSaug6LVZWE-unsplash.jpg",
        "the-cleveland-museum-of-art-Ir7apM_ZDrA-unsplash.jpg",
        "the-cleveland-museum-of-art-QpxGWEvCtYE-unsplash.jpg",
        "the-cleveland-museum-of-art-U9QJy0F_3MU-unsplash.jpg",
        "the-cleveland-museum-of-art-zCuiDBrKIVo-unsplash.jpg",
        "the-cleveland-museum-of-art-Zn0ej6CFbOw-unsplash.jpg",
        "the-new-york-public-library-XDLJIT94Eg8-unsplash.jpg",
        "the-walters-art-museum-K0LM79r2uGs-unsplash.jpg"
      ];
      const artwork = document.getElementById("artwork");
      const wash = document.getElementById("wash");
      const progress = document.getElementById("progress");
      const slideInterval = 213000;
      const storageKey = "yakob-japanese-art-index";
      function readSavedIndex() {
        try {
          const saved = Number.parseInt(localStorage.getItem(storageKey), 10);
          return Number.isInteger(saved) && saved >= 0 ? saved % files.length : 0;
        } catch (_) {
          return 0;
        }
      }
      let index = readSavedIndex();
      const source = file => `assets/japan/${encodeURIComponent(file)}`;

      function show(nextIndex) {
        index = (nextIndex + files.length) % files.length;
        try { localStorage.setItem(storageKey, String(index)); } catch (_) {}
        const path = source(files[index]);
        artwork.style.opacity = "0";
        wash.style.opacity = "0";
        const preload = new Image();
        preload.onload = () => {
          artwork.src = path;
          wash.src = path;
          artwork.style.opacity = "1";
          wash.style.opacity = "1";
        };
        preload.onerror = () => {
          artwork.style.opacity = "1";
          wash.style.opacity = "1";
        };
        preload.src = path;
        progress.style.transition = "none";
        progress.style.width = "0";
        requestAnimationFrame(() => {
          progress.style.transition = `width ${slideInterval}ms linear`;
          progress.style.width = "100%";
        });
      }

      show(index);
      window.setInterval(() => show(index + 1), slideInterval);
    })();
  </script>
</body>
</html>
