<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closer</title>
<style>
  /* Igual que el reloj y la fecha: invertido a propósito.
     Modo claro del sistema → tarjeta de cristal negra; modo oscuro → tarjeta blanca.
     Parámetros de la URL: h = pasos hechos · t = pasos totales · f = fecha límite (AAAA-MM-DD) */
  :root{
    --glass: rgba(0,0,0,0.78);
    --glass-edge: rgba(255,255,255,0.18);
    --glass-edge-soft: rgba(255,255,255,0.06);
    --label: #f5f5f7;
    --secondary-label: #a0a0a5;
    --track: rgba(255,255,255,0.13);
    --sys-red: #FF3B30;
    --ring-a: #FA114F;
    --ring-b: #FF5C8D;
    --glow: rgba(0,0,0,0.65);
    --shadow: 0 1px 1px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --glass: rgba(255,255,255,0.92);
      --glass-edge: rgba(255,255,255,0.9);
      --glass-edge-soft: rgba(0,0,0,0.04);
      --label: #1c1c1e;
      --secondary-label: #6e6e73;
      --track: rgba(0,0,0,0.08);
      --sys-red: #FF453A;
      --ring-a: #F5094A;
      --ring-b: #FF4F86;
      --glow: rgba(255,255,255,0.6);
      --shadow: 0 1px 1px rgba(0,0,0,0.05), 0 12px 32px rgba(0,0,0,0.14);
    }
  }

  html,body{ margin:0; padding:0; height:100%; background:#fff; }
  @media (prefers-color-scheme: dark){ html,body{ background:#191919; } }

  body{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage{
    position: relative;
    width: 100%;
    height: 100%;
    display:flex; align-items:center; justify-content:center;
  }

  /* halo difuminado detrás de la tarjeta (como en el reloj) */
  .glow{
    position: absolute;
    width: 86%;
    height: 96%;
    border-radius: 50%;
    background: radial-gradient(closest-side, var(--glow), transparent 72%);
    filter: blur(30px);
    z-index: 0;
    pointer-events: none;
  }

  .widget{
    position: relative;
    z-index: 1;
    width: min(96%, 1400px);
    box-sizing: border-box;
    padding: 16px 28px 16px 18px;
    border-radius: 22px;
    background: var(--glass);
    box-shadow:
      var(--shadow),
      inset 0 1px 1px var(--glass-edge),
      inset 0 0 0 1px var(--glass-edge-soft);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    backdrop-filter: blur(28px) saturate(190%);
    overflow: hidden;
    display:flex; align-items:center; gap: 20px;
    isolation: isolate;
  }

  /* brillo de cristal (igual que el reloj) */
  .widget::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(165deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 18%, rgba(255,255,255,0) 40%);
    mix-blend-mode: overlay;
    pointer-events:none;
  }
  @media (prefers-color-scheme: dark){
    .widget::before{
      background: linear-gradient(165deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.12) 18%, rgba(255,255,255,0) 38%);
    }
  }

  /* ---------- anillo ---------- */
  .ring{
    position: relative; z-index: 1;
    flex: 0 0 auto;
    width: 104px; height: 104px;
  }
  .ring svg{ width:100%; height:100%; transform: rotate(-90deg); overflow: visible; }
  .ring .track{ fill:none; stroke: var(--track); stroke-width: 11; }
  .ring .arc{
    fill:none; stroke: url(#grad); stroke-width: 11; stroke-linecap: round;
    transition: stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1);
    filter: drop-shadow(0 0 3px rgba(250,17,79,0.35));
  }
  .ring .pct{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color: var(--label);
    font-size: 25px; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .ring .pct small{ font-size: 13px; font-weight: 600; margin-left: 1px; margin-top: 5px; color: var(--secondary-label); }

  /* ---------- texto ---------- */
  .info{ position: relative; z-index: 1; flex: 1 1 auto; min-width: 0; display:flex; flex-direction:column; }
  .eyebrow{
    display:flex; align-items:center; gap: 6px;
    color: var(--ring-a);
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden;
  }
  .eyebrow svg{ width: 14px; height: 14px; flex: 0 0 auto; }
  .eyebrow span{ overflow: hidden; text-overflow: ellipsis; }
  /* título a la izquierda y días a la derecha: más a lo ancho, menos alto */
  .row{ margin-top: 5px; display:flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .title{
    color: var(--label);
    font-size: 23px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .title span{ color: var(--secondary-label); font-weight: 500; }
  .meta{
    color: var(--secondary-label);
    font-size: 13.5px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- segmentos ---------- */
  .steps{ margin-top: 13px; display:flex; gap: 4px; height: 8px; }
  .seg{
    flex: 1 1 0; min-width: 3px; border-radius: 4px;
    background: var(--track);
    transform: scaleY(.6); opacity: .0;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s ease, background-color .3s ease;
  }
  .seg.in{ transform: scaleY(1); opacity: 1; }
  .seg.done{ background: var(--ring-a); }
  .seg.next{
    background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--ring-a);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: inset 0 0 0 1.5px var(--ring-a); }
    50%{ box-shadow: inset 0 0 0 1.5px var(--ring-a), 0 0 8px 1px rgba(250,17,79,.45); background: rgba(250,17,79,.18); }
  }

  /* ---------- móvil / columnas estrechas ---------- */
  @media (max-width: 600px){
    .row{ flex-direction: column; align-items: flex-start; gap: 3px; }
  }
  @media (max-width: 420px){
    .widget{ gap: 14px; padding: 14px 16px 14px 14px; border-radius: 20px; }
    .ring{ width: 80px; height: 80px; }
    .ring .pct{ font-size: 20px; }
    .ring .pct small{ font-size: 11px; margin-top: 3px; }
    .title{ font-size: 19px; }
    .meta{ font-size: 12px; }
    .steps{ gap: 2px; height: 6px; margin-top: 10px; }
  }

  @media (prefers-reduced-motion: reduce){
    .ring .arc, .seg{ transition: none; }
    .seg.next{ animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="widget" id="widget" role="img">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" style="stop-color: var(--ring-a)"/>
              <stop offset="100%" style="stop-color: var(--ring-b)"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="60" cy="60" r="50"/>
          <circle class="arc" id="arc" cx="60" cy="60" r="50"/>
        </svg>
        <div class="pct"><span id="pct">0</span><small>%</small></div>
      </div>
      <div class="info">
        <div class="eyebrow">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 1 8.5 12 14l9-4.5V16h2V8.5L12 3z"/><path d="M5 12.2V16c0 1.66 3.13 3 7 3s7-1.34 7-3v-3.8l-7 3.5-7-3.5z"/></svg>
          <span id="eyebrow">Certificarme como Closer</span>
        </div>
        <div class="row">
          <div class="title" id="title">0 <span>de 0 pasos</span></div>
          <div class="meta" id="meta"></div>
        </div>
        <div class="steps" id="steps"></div>
      </div>
    </div>
  </div>
  <script>
    (function(){
      var q = new URLSearchParams(location.search);
      var t = Math.max(0, parseInt(q.get("t") || "21", 10) || 0);
      var h = Math.min(t, Math.max(0, parseInt(q.get("h") || "0", 10) || 0));
      var f = q.get("f") || "";
      var label = q.get("titulo") || "Certificarme como Closer";
      var pct = t ? Math.round(h / t * 100) : 0;
      var done = t > 0 && h >= t;
      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

      var MES = ["ene","feb","mar","abr","may","jun","jul","ago","sept","oct","nov","dic"];

      // días que quedan, contando con la fecha de hoy en Madrid
      function hoyMadrid(){
        var p = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Madrid", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
        return p; // AAAA-MM-DD
      }
      function diasHasta(fecha){
        var a = hoyMadrid().split("-").map(Number), b = fecha.split("-").map(Number);
        return Math.round((Date.UTC(b[0], b[1]-1, b[2]) - Date.UTC(a[0], a[1]-1, a[2])) / 86400000);
      }
      var meta = "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(f)) {
        var b = f.split("-").map(Number), d = diasHasta(f);
        var cuando = d > 1 ? "Quedan " + d + " días" : d === 1 ? "Queda 1 día" : d === 0 ? "Es hoy" : "Fecha pasada";
        meta = cuando + " · " + b[2] + " " + MES[b[1]-1];
      }

      document.getElementById("eyebrow").textContent = done ? "Closer certificado" : label;
      document.getElementById("title").innerHTML = h + " <span>de " + t + " pasos</span>";
      document.getElementById("meta").textContent = done ? "¡Lo has conseguido!" : meta;
      document.getElementById("widget").setAttribute("aria-label", label + ": " + h + " de " + t + " pasos, " + pct + " %. " + meta);

      // anillo
      var arc = document.getElementById("arc");
      var C = 2 * Math.PI * 50;
      arc.style.strokeDasharray = C;
      arc.style.strokeDashoffset = C;
      if (pct === 0) arc.style.opacity = 0;

      // segmentos
      var steps = document.getElementById("steps"), segs = [];
      for (var i = 0; i < t; i++) {
        var s = document.createElement("div");
        s.className = "seg" + (i < h ? " done" : (i === h ? " next" : ""));
        if (i < h) {
          // degradado continuo a lo largo de los pasos hechos, como el anillo
          var k = h > 1 ? Math.round(i / (h - 1) * 100) : 0;
          s.style.background = "color-mix(in srgb, var(--ring-b) " + k + "%, var(--ring-a))";
        }
        steps.appendChild(s); segs.push(s);
      }

      function animar(){
        arc.style.strokeDashoffset = C * (1 - pct / 100);
        segs.forEach(function(s, i){ setTimeout(function(){ s.classList.add("in"); }, reduce ? 0 : 120 + i * 28); });
        var el = document.getElementById("pct");
        if (reduce) { el.textContent = pct; return; }
        var t0 = null, dur = 1300;
        function paso(ts){
          if (!t0) t0 = ts;
          var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
          el.textContent = Math.round(pct * e);
          if (k < 1) requestAnimationFrame(paso);
        }
        requestAnimationFrame(paso);
      }
      requestAnimationFrame(function(){ requestAnimationFrame(animar); });
    })();
  </script>
</body>
</html>
